[project]
name = "agentcrawlerstudio"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.0",
    "black>=24.0.0",
    "deepagents>=0.7.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-mongodb>=0.4.0",
    "lxml>=5.3.0",
    "motor>=3.6.0",
    "pillow>=12.3.0",
    "playwright>=1.62.0",
    "pymongo>=4.9.0",
    "pylsp-mypy>=0.8.0",
    "python-lsp-server[all]>=1.15.0",
    "uvicorn[standard]>=0.52.1",
]

[tool.fastapi]
entrypoint = "backend.main:app"

[dependency-groups]
dev = [
    "mongomock>=4.2.0",
    "mongomock-motor>=0.0.27",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/main.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
