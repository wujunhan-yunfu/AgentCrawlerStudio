[project]
name = "agentcrawlerstudio"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "black>=26.10.1",
    "deepagents>=0.7.28",
    "fastapi>=0.150.0",
    "httpx>=0.28.1",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-mongodb>=0.5.1",
    "lxml>=6.1.3",
    "motor>=3.7.1",
    "pillow>=13.0.0",
    "playwright>=1.64.0",
    "pymongo>=4.19.0",
    "pylsp-mypy>=0.8.2",
    "python-lsp-server[all]>=1.15.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.fastapi]
entrypoint = "backend.main:app"

[tool.uv]
# Consider every configured index so the newest version wins even when the
# primary mirror lags behind PyPI.
index-strategy = "unsafe-best-match"

[dependency-groups]
dev = [
    "mongomock>=4.3.0",
    "mongomock-motor>=0.0.36",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/main.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
