<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%232b6cb0'/><stop offset='100%25' stop-color='%2338a169'/></linearGradient></defs><rect x='2' y='2' width='60' height='60' rx='14' fill='url(%23g)'/><rect x='16' y='20' width='32' height='25' rx='4' fill='none' stroke='%23ffffff' stroke-width='3'/><path d='M16 27h32' stroke='%23ffffff' stroke-width='3'/><circle cx='21.5' cy='23.5' r='1.6' fill='%23f56565'/><circle cx='27.5' cy='23.5' r='1.6' fill='%23ecc94b'/><circle cx='33.5' cy='23.5' r='1.6' fill='%2348bb78'/><path d='M21 34h9M21 39.5h9' stroke='%2348bb78' stroke-width='2.5' stroke-linecap='round'/></svg>"
    />
    <title>爬虫工作台</title>
    <script>
      (function () {
        try {
          var lang = localStorage.getItem("acs-lang") || "zh";
          document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
          document.title = lang === "en" ? "AgentCrawlerStudio" : "爬虫工作台";
        } catch (e) {}
        try {
          var m = localStorage.getItem("acs-color-theme") || "system";
          var d =
            m === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : m;
          document.documentElement.dataset.theme = d;
          document.documentElement.style.colorScheme = d;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
